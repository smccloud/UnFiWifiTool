<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="UniFi WiFi Access Manager">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121E33"/>
      <stop offset="0.55" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="52%">
      <stop offset="0" stop-color="#30D6C4" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#30D6C4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#30D6C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FF5E2"/>
      <stop offset="1" stop-color="#28C9B8"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="256" cy="238" r="168" fill="url(#glow)"/>

  <!-- Soft teal halo behind the mark -->
  <g fill="none" stroke="#30D6C4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#blur)">
    <path d="M256 138 L358 172 V252 C358 316 316 360 256 384 C196 360 154 316 154 252 V172 Z"/>
    <path d="M176.3 237.1 A104 104 0 0 1 335.7 237.1"/>
    <path d="M200.8 257.7 A72 72 0 0 1 311.2 257.7"/>
    <path d="M225.3 278.2 A40 40 0 0 1 286.7 278.2"/>
  </g>

  <!-- Shield + WiFi mark -->
  <g fill="none" stroke="url(#mark)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 138 L358 172 V252 C358 316 316 360 256 384 C196 360 154 316 154 252 V172 Z" fill="#30D6C4" fill-opacity="0.05"/>
    <path d="M176.3 237.1 A104 104 0 0 1 335.7 237.1"/>
    <path d="M200.8 257.7 A72 72 0 0 1 311.2 257.7"/>
    <path d="M225.3 278.2 A40 40 0 0 1 286.7 278.2"/>
    <circle cx="256" cy="304" r="10" fill="url(#mark)" stroke="none"/>
  </g>
</svg>
